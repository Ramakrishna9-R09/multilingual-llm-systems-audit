name: Verify audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: My work/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement "My work/requirements.txt"

      - name: Recompute tokenizer results
        run: python "My work/partA/scripts/run_analysis.py"

      - name: Recompute serving reconciliation
        run: python "My work/partB/analyze_bench.py"

      - name: Run targeted tests
        run: python -m unittest discover -s "My work/partA/tests" -v

      - name: Confirm deterministic evidence matches the committed results
        run: >-
          git diff --exit-code --
          "My work/partA/results/audit_variants_gpt2.csv"
          "My work/partA/results/corrected_metrics.csv"
          "My work/partA/results/cross_language_ratios.csv"
          "My work/partA/results/normalization_probe.csv"
          "My work/partB/bench_reconciliation.csv"
          "My work/partB/capacity_results.json"
