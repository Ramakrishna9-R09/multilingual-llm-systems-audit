name: Verify portable components

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: My work/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement "My work/requirements.txt"

      - name: Run data-independent tests
        run: python -m unittest discover -s "My work/partA/tests" -v
