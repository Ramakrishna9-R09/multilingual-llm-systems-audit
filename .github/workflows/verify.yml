name: Verify audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: your-submission/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement your-submission/requirements.txt

      - name: Recompute tokenizer results
        run: python your-submission/partA/scripts/run_analysis.py

      - name: Recompute serving reconciliation
        run: python your-submission/partB/analyze_bench.py

      - name: Run targeted tests
        run: python -m unittest discover -s your-submission/partA/tests -v

      - name: Confirm deterministic evidence matches the committed results
        run: >-
          git diff --exit-code --
          your-submission/partA/results/audit_variants_gpt2.csv
          your-submission/partA/results/corrected_metrics.csv
          your-submission/partA/results/cross_language_ratios.csv
          your-submission/partA/results/normalization_probe.csv
          your-submission/partB/bench_reconciliation.csv
          your-submission/partB/capacity_results.json
